<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trelastpriser Verdal</title><style>body{margin:0;background:#f4f6f8;color:#16211b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(135deg,#10251b,#237247);color:#fff;padding:42px 20px 75px}.wrap{max-width:1100px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;opacity:.75}h1{font-size:clamp(36px,6vw,58px);margin:10px 0}header p{max-width:680px;color:#d9e9df}.panel{max-width:1100px;margin:-40px auto 30px;padding:22px;background:#fff;border-radius:20px;box-shadow:0 12px 35px #14261b14}.controls{display:grid;grid-template-columns:1fr 1fr 160px;gap:14px}label{display:block;font-size:12px;font-weight:800;color:#69746e;margin-bottom:7px}select,input{width:100%;padding:13px;border:1px solid #e2e8e4;border-radius:11px;background:#fff;font-size:15px}.top{display:flex;justify-content:space-between;align-items:end;margin:28px 0 16px}.top h2{margin:0}.updated{font-size:12px;color:#69746e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{border:1px solid #e2e8e4;border-radius:17px;padding:20px}.best{border:2px solid #17633d}.store{font-weight:800;font-size:16px;margin-bottom:17px}.price{font-size:32px;font-weight:900}.unit{font-size:14px;color:#69746e}.status{margin-top:12px;font-size:12px;color:#69746e}.badge{display:inline-block;background:#e9f5ee;color:#17633d;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900;margin-bottom:12px}.total{margin-top:20px;background:#14221b;color:#fff;border-radius:17px;padding:19px;display:flex;justify-content:space-between}.total small{color:#bdcfc4}.total strong{font-size:28px}@media(max-width:760px){.controls,.grid{grid-template-columns:1fr}.top{display:block}.total{display:block}.total strong{display:block;margin-top:8px}}</style></head><body><header><div class="wrap"><div class="eyebrow">Verdal · automatisk prissjekk</div><h1>Trelastpriser</h1><p>Sammenlign pris per løpemeter hos OBS BYGG Verdal, Bygger'n Verdal og XL-BYGG Skogn.</p></div></header><main class="panel"><div class="controls"><div><label>DIMENSJON</label><select id="dim"><option>48x98</option><option>48x148</option><option>48x198</option></select></div><div><label>TYPE</label><select id="type"><option value="ubh">Ubehandlet C24</option><option value="imp">Impregnert C24</option></select></div><div><label>METER</label><input id="meters" type="number" min="1" value="30"></div></div><div class="top"><h2 id="heading"></h2><div class="updated" id="updated">Laster prisdata…</div></div><div class="grid" id="cards"></div><div class="total"><div><small>Billigste bekreftede lokalpris × valgt mengde</small><div id="qty"></div></div><strong id="total">–</strong></div></main><script>let data={};async function load(){try{data=await fetch('data/prices.json?'+Date.now()).then(r=>r.json());render()}catch(e){document.querySelector('#updated').textContent='Prisdata kunne ikke lastes'}}function render(){const dim=document.querySelector('#dim').value,type=document.querySelector('#type').value,meters=Math.max(1,+document.querySelector('#meters').value||1),rows=(data.items||[]).filter(x=>x.dimension===dim&&x.type===type&&x.price_per_meter!=null&&x.verified_local);document.querySelector('#heading').textContent=dim.replace('x',' × ')+' mm · '+(type==='ubh'?'Ubehandlet':'Impregnert')+' C24';document.querySelector('#updated').textContent=data.updated_at?'Sist oppdatert: '+new Date(data.updated_at).toLocaleString('nb-NO'):'Ingen oppdatering registrert';if(!rows.length){document.querySelector('#cards').innerHTML='<p>Ingen bekreftet lokalpris tilgjengelig for dette valget.</p>';document.querySelector('#qty').textContent='';document.querySelector('#total').textContent='–';return}const best=Math.min(...rows.map(r=>r.price_per_meter));document.querySelector('#cards').innerHTML=rows.map(x=>`<article class="card ${x.price_per_meter===best?'best':''}">${x.price_per_meter===best?'<div class="badge">BILLIGST</div>':''}<div class="store">${x.store}</div><div class="price">kr ${x.price_per_meter.toLocaleString('nb-NO',{minimumFractionDigits:2})} <span class="unit">/ m</span></div><div class="status">${x.status||'Lokalpris bekreftet'}</div></article>`).join('');document.querySelector('#qty').textContent=meters+' meter';document.querySelector('#total').textContent='kr '+(best*meters).toLocaleString('nb-NO',{minimumFractionDigits:2})}['dim','type','meters'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));load();setInterval(load,300000)</script></body></html>
