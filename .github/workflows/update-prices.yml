name: Oppdater trelastpriser

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Python-avhengigheter
        run: pip install -r requirements.txt

      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium

      - name: Kjør butikkspesifikk scraper
        run: python scraper/scrape_prices.py

      - name: Lagre oppdaterte priser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Oppdater trelastpriser"
          git push
