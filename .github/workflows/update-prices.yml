name: Oppdater trelastpriser

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trelast-priser
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Python-avhengigheter
        run: pip install -r requirements.txt

      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium

      - name: Kjør butikkspesifikk scraper
        run: python -m scraper.run_scraper

      - name: Fjern ubekreftede butikkpriser
        run: python scraper/normalize_prices.py

      - name: Lagre oppdaterte priser
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Ingen prisendringer å lagre."
            exit 0
          fi
          git commit -m "Oppdater butikkbekreftede trelastpriser"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            echo "Push/rebase feilet på forsøk $attempt – prøver igjen."
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "Klarte ikke å pushe prisoppdateringen etter 3 forsøk."
          exit 1
